<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>אימון חשבון עד 100</title>

<style>
:root {
  --bg1: #f5f7ff;
  --bg2: #dbeafe;
  --card-bg: #ffffff;
  --accent: #007aff;
  --accent-soft: #e0edff;
  --danger: #ff3b30;
  --success: #34c759;
  --text-main: #0f172a;
  --text-soft: #6b7280;
  --shadow-soft: 0 18px 40px rgba(15,23,42,0.15);
  --radius-card: 22px;
  --radius-pill: 999px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(145deg, var(--bg1), var(--bg2));
  color: var(--text-main);
  display: flex;
  justify-content: center;
  padding: 12px;
}

.app {
  width: 100%;
  max-width: 480px;
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-soft);
  padding: 20px 16px;
}

.app-title {
  text-align: center;
  margin: 0;
  font-size: 1.7rem;
  font-weight: 700;
}

.app-subtitle {
  text-align: center;
  margin: 4px 0 12px;
  color: var(--text-soft);
  font-size: 0.9rem;
}

.section-label {
  font-size: 0.85rem;
  color: var(--text-soft);
  margin-bottom: 6px;
  font-weight: 600;
}

.pill-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}

.pill-button {
  border-radius: var(--radius-pill);
  border: none;
  padding: 8px 14px;
  font-size: 0.85rem;
  background: #eef1f6;
  color: var(--text-main);
  cursor: pointer;
  transition: 0.15s;
}

.pill-button.active {
  background: var(--accent);
  color: #fff;
}

.question-section {
  margin-top: 14px;
  background: var(--accent-soft);
  border-radius: 18px;
  padding: 18px 12px;
  text-align: center;
}

.question-row {
  font-size: 2.1rem;
  font-weight: 700;
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 12px;
  direction: ltr;   /* התרגיל משמאל לימין */
}

#answerInput {
  width: 100%;
  max-width: 220px;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid #cbd5e1;
  text-align: center;
  font-size: 1.2rem;
  outline: none;
}

.controls {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn-primary,
.btn-ghost {
  padding: 12px;
  font-size: 1rem;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: 0.15s;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-ghost {
  background: rgba(148,163,184,0.12);
  color: var(--text-main);
}

.feedback {
  text-align: center;
  min-height: 26px;
  margin-top: 10px;
  font-size: 1rem;
}

.feedback.good { color: var(--success); }
.feedback.bad  { color: var(--danger); }

.stats-row {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  color: var(--text-soft);
}
.stats-row strong { color: var(--text-main); }
</style>
</head>
<body>

<div class="app">
  <div class="card">

    <h1 class="app-title">אימון חשבון</h1>
    <p class="app-subtitle">תרגול חיבור, חיסור, כפל וחילוק עד 100</p>

    <div>
      <div class="section-label">סוג תרגול</div>
      <div class="pill-buttons">
        <button class="pill-button active" data-mode="mix">מעורב</button>
        <button class="pill-button" data-mode="add">חיבור</button>
        <button class="pill-button" data-mode="sub">חיסור</button>
        <button class="pill-button" data-mode="mul">כפל</button>
        <button class="pill-button" data-mode="div">חילוק</button>
      </div>
    </div>

    <div class="question-section">
      <div class="question-row">
        <span id="operand1">5</span>
        <span id="operator">+</span>
        <span id="operand2">3</span>
        <span>=</span>
        <span>?</span>
      </div>

      <input id="answerInput" type="number" inputmode="numeric" placeholder="הקלד/י תשובה">
    </div>

    <div class="controls">
      <button class="btn-primary" id="checkBtn">בדיקה</button>
      <button class="btn-ghost" id="nextBtn">תרגיל חדש</button>
    </div>

    <div id="feedback" class="feedback"></div>

    <div class="stats-row">
      <span>נכון: <strong id="correctCount">0</strong></span>
      <span>מתוך: <strong id="totalCount">0</strong></span>
    </div>

  </div>
</div>

<script>
const operand1El = document.getElementById('operand1');
const operand2El = document.getElementById('operand2');
const operatorEl = document.getElementById('operator');
const answerInput = document.getElementById('answerInput');
const feedbackEl = document.getElementById('feedback');
const correctCountEl = document.getElementById('correctCount');
const totalCountEl = document.getElementById('totalCount');

const checkBtn = document.getElementById('checkBtn');
const nextBtn = document.getElementById('nextBtn');
const modeButtons = document.querySelectorAll('.pill-button');

let currentMode = "mix";
let currentAnswer = null;
let correctCount = 0;
let totalCount = 0;

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function createAddition() {
  const a = rand(0, 100);
  const b = rand(0, 100 - a);
  return { a, b, op: '+', answer: a + b };
}

function createSubtraction() {
  const a = rand(0, 100);
  const b = rand(0, a);
  return { a, b, op: '−', answer: a - b };
}

function createMultiplication() {
  let a, b;
  do {
    a = rand(0, 12);
    b = rand(0, 12);
  } while (a * b > 100);
  return { a, b, op: '×', answer: a * b };
}

function createDivision() {
  let a, b, p;
  do {
    a = rand(1, 12);
    b = rand(1, 12);
    p = a * b;
  } while (p > 100);
  return Math.random() < 0.5
    ? { a: p, b: a, op: '÷', answer: b }
    : { a: p, b: b, op: '÷', answer: a };
}

function getQuestion() {
  let mode = currentMode;
  if (mode === "mix") {
    const modes = ["add", "sub", "mul", "div"];
    mode = modes[rand(0, 3)];
  }
  if (mode === "add") return createAddition();
  if (mode === "sub") return createSubtraction();
  if (mode === "mul") return createMultiplication();
  if (mode === "div") return createDivision();
}

function generate() {
  const q = getQuestion();
  operand1El.textContent = q.a;
  operand2El.textContent = q.b;
  operatorEl.textContent = q.op;
  currentAnswer = q.answer;
  answerInput.value = "";
  feedbackEl.textContent = "";
  answerInput.focus();
}

checkBtn.onclick = function () {
  if (answerInput.value.trim() === "") {
    feedbackEl.textContent = "נא להזין תשובה 🙂";
    feedbackEl.className = "feedback bad";
    return;
  }

  totalCount++;
  totalCountEl.textContent = totalCount;

  const user = Number(answerInput.value);
  if (user === currentAnswer) {
    correctCount++;
    correctCountEl.textContent = correctCount;
    feedbackEl.textContent = "מצוין! ✔️";
    feedbackEl.className = "feedback good";
  } else {
    feedbackEl.textContent = "לא מדויק... התשובה היא " + currentAnswer;
    feedbackEl.className = "feedback bad";
  }
};

nextBtn.onclick = generate;

modeButtons.forEach(btn => {
  btn.onclick = () => {
    modeButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    generate();
  };
});

generate();
</script>

</body>
</html>
